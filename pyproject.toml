[project]
name = "codename-generator"
version = "0.0.6"
description = "MCP server and web UI for managing project codenames"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.3",
    "pydantic>=2.12.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codename_generator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/codename_generator/server.py" = ["E501"]  # MCP tool descriptions are long by nature
"src/codename_generator/migrations.py" = ["E501"]  # SQL DDL statements
