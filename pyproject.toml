[project]
name = "codename-generator"
version = "0.0.2"
description = "MCP server for managing project codenames"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.3",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codename_generator"]
